[project]
name = "phishbowl-agent"
version = "0.1.0"
description = "PhishBowl phishing-triage agent for Amazon Bedrock AgentCore Runtime"
requires-python = ">=3.12"
dependencies = [
    "bedrock-agentcore>=0.1.0",
    "strands-agents>=0.1.0",
    "boto3>=1.34",
    "requests>=2.32",
]

# Runnable app, not an installable library — no build backend needed.
[tool.uv]
package = false
